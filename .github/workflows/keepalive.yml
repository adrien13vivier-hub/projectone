name: Keep-Alive
# GitHub désactive les crons après 60 jours d'inactivité.
# Ce workflow se lance chaque lundi pour maintenir le repo actif.
# Il se contente de maintenir l'activite du depot et de reactiver l'analyse
# quotidienne si GitHub l'a desactivee. Il ne DECLENCHE plus l'analyse :
# voir la note en fin de fichier.
on:
  schedule:
    - cron: "0 7 * * 1"  # Chaque lundi à 07h00 UTC
  workflow_dispatch:

jobs:
  keepalive:
    name: Maintien activité repo
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write   # CORRECTION : nécessaire pour déclencher workflow_dispatch
    steps:
      - uses: actions/checkout@v4

      - name: Ping keep-alive (commit minimal)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "$(date -u '+%Y-%m-%d %H:%M UTC')" >> .keepalive
          git add .keepalive
          git commit -m "💓 keep-alive $(date -u '+%Y-%m-%d')"
          git push

      # Reactiver daily_analysis si GitHub l'a desactive.
      # GitHub desactive un workflow planifie apres 60 jours sans activite ;
      # les commits ne comptent PAS comme activite de workflow.
      - name: Reactiver l'analyse quotidienne si besoin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          WORKFLOW="daily_analysis.yml"

          STATE=$(gh api repos/$REPO/actions/workflows/$WORKFLOW --jq '.state' 2>/dev/null || echo "unknown")
          echo "Etat du workflow $WORKFLOW : $STATE"

          if [ "$STATE" = "disabled_inactivity" ] || [ "$STATE" = "disabled_manually" ]; then
            echo "Workflow desactive ($STATE) — reactivation."
            gh api repos/$REPO/actions/workflows/$WORKFLOW/enable -X PUT
            echo "Reactive."
          else
            echo "Workflow actif ($STATE) — rien a faire."
          fi

      # ── CE QUI A ETE RETIRE, ET POURQUOI ──────────────────────────────
      # Ce workflow declenchait aussi l'analyse chaque lundi, via
      # « gh workflow run daily_analysis.yml ».
      #
      # Il tourne a 07h00 UTC, soit 9h du matin a Paris : les bourses
      # europeennes viennent d'ouvrir et New York n'a pas encore commence.
      # L'analyse relevait donc des cours de SEANCE et les ecrivait dans
      # history.csv, qui n'attend que des cours de CLOTURE. Le dernier
      # rapport produit sur ce depot, le 31 aout a 16h30, vient de la : ce
      # n'etait pas le rapport du soir, c'etait un releve de milieu de
      # journee declenche par ce keep-alive.
      #
      # Le declenchement legitime vient desormais du serveur, a 22h37, avec
      # les crons du workflow en filet de securite. Le keep-alive se
      # contente de son role : maintenir le depot actif.
